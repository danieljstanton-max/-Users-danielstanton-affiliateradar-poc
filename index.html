<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affswap — the verified network for iGaming affiliate managers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap">
<style>
:root {
  --ground: #F4F7FB;
  --card: #FFFFFF;
  --ink: #0B1B33;
  --ink-2: #3B4A63;
  --ink-mute: #7A8699;
  --ink-faint: #A9B3C3;
  --line: #E4EBF3;
  --line-strong: #D2DCE8;
  --blue: #3D7CFF;
  --blue-hi: #2461FF;
  --blue-deep: #1A3FCC;
  --blue-cyan: #00D9FF;
  --blue-soft: #EAF1FA;
  --blue-softer: #F3F7FC;
  --violet: #8B5CF6;
  --violet-hi: #6D28D9;
  --up: #14B87A;
  --up-soft: #E7F7EF;
  --warn: #E5484D;
  --grad: linear-gradient(135deg, #6D28D9 0%, #3D7CFF 50%, #00D9FF 100%);
  --shadow-sm: 0 1px 2px rgba(15,30,60,0.04);
  --shadow-md: 0 4px 14px rgba(15,30,60,0.06);
  --shadow-lg: 0 12px 32px rgba(15,30,60,0.08);
  --glow-blue: 0 0 0 1px rgba(61,124,255,0.15), 0 6px 22px rgba(61,124,255,0.32);
  --glow-blue-hover: 0 0 0 1px rgba(36,97,255,0.20), 0 10px 30px rgba(36,97,255,0.42);
  --glow-warm: 0 0 0 1px rgba(255,138,66,0.18), 0 6px 22px rgba(255,138,66,0.32);
  --glow-warm-hover: 0 0 0 1px rgba(232,96,36,0.26), 0 12px 32px rgba(232,96,36,0.46);
  --f-body: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-mono: "Geist Mono", "SF Mono", ui-monospace, Menlo, monospace;
  --f-annot: "Caveat", "Segoe Script", cursive;
  --f-flag: "Twemoji Country Flags", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;font-variant-numeric:tabular-nums;margin:0;overflow-x:hidden}
::selection{background:rgba(61,124,255,0.2);color:var(--ink)}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p,ul,ol,table{margin:0;padding:0;list-style:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}
input,select,textarea{font-family:inherit;font-size:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.flag{display:inline-block;vertical-align:middle;font-size:15px;line-height:1;margin-right:8px;font-family:var(--f-flag)}
.flag-big{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;font-size:22px;line-height:1;flex:0 0 28px;font-family:var(--f-flag)}
.num{font-variant-numeric:tabular-nums}

/* NAV */
.nav-outer{padding:20px 0 0}
.nav{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 18px 10px 22px;display:flex;align-items:center;gap:30px;box-shadow:var(--shadow-sm)}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-0.02em;color:var(--ink)}
.brand svg{width:26px;height:26px}
.brand em{font-style:normal;color:var(--blue);font-weight:700}
.nav-links{display:flex;gap:26px;margin:0 auto;font-size:14.5px;font-weight:500;color:var(--ink-2)}
.nav-links a{position:relative;padding:6px 0;cursor:pointer}
.nav-links a:hover{color:var(--ink)}
.nav-links a.on{color:var(--blue)}
.nav-links a.on::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:2px;background:var(--blue);border-radius:2px}
.nav-right{display:flex;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:var(--blue-soft);color:var(--blue-hi);font-weight:600;font-size:13.5px;border-radius:999px}
.pill svg{width:14px;height:14px}
.avatar-btn{display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;background:var(--card);border:1px solid var(--line);border-radius:999px;cursor:pointer;position:relative}
.nav-match-dot{position:absolute;top:2px;right:22px;width:10px;height:10px;border-radius:50%;background:#E5484D;border:2px solid var(--card);box-shadow:0 0 0 0 rgba(229,72,77,0.55);animation:tabDotPulse 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.nav-match-dot{animation:none}}
.avatar-30{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px;background:linear-gradient(135deg,#6D28D9,#3D7CFF);flex:0 0 30px}
.caret{color:var(--ink-mute);font-size:12px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:10px;font-weight:600;font-size:14.5px;box-shadow:var(--glow-blue);transition:background .16s ease,transform .06s ease,box-shadow .16s ease}
.btn:hover{background:var(--blue-hi);border-color:var(--blue-hi);box-shadow:var(--glow-blue-hover)}
.btn:active{transform:translateY(1px)}
.btn-gho{background:var(--card);color:var(--ink);border:1px solid var(--line-strong);box-shadow:var(--shadow-sm)}
.btn-gho:hover{border-color:var(--blue);color:var(--blue)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px}

/* EYEBROW / SECTION HEAD */
.eyebrow{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--blue);margin-bottom:20px}
.section-eye{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
h2.section-h{font-size:clamp(26px,3.2vw,38px);font-weight:700;line-height:1.12;letter-spacing:-0.035em;color:var(--ink);text-wrap:balance;max-width:22ch}
.section-sub{color:var(--ink-2);font-size:15.5px;max-width:42ch;margin-top:6px}
.section-link{color:var(--blue);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}

/* VIEW SLOTS */
.view{display:none}
.view.on{display:block}

/* CHIPS */
.chip{display:inline-block;padding:4px 10px;background:var(--blue-soft);color:var(--blue-hi);font-size:11.5px;font-weight:600;border-radius:999px;margin-right:5px}
.chip.more{background:transparent;color:var(--ink-mute);border:1px dashed var(--line-strong)}

/* HOME */
.hero{padding:60px 0 40px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;position:relative;z-index:1}
h1.hero-h{font-size:clamp(40px,5.4vw,68px);font-weight:800;line-height:1.06;letter-spacing:-0.03em;color:var(--ink);margin-bottom:20px;text-wrap:balance}
.hero-lede{font-size:16.5px;line-height:1.65;color:var(--ink-2);max-width:44ch;margin-bottom:28px}
.hero-lede b{color:var(--ink);font-weight:500}
.hero-cta{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.trust-row{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.trust{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.trust .tico{width:22px;height:22px;border-radius:6px;background:var(--blue-soft);color:var(--blue);display:inline-flex;align-items:center;justify-content:center}
.trust .tico svg{width:12px;height:12px}
.hero-img{width:100%;max-width:620px;margin-left:auto;filter:drop-shadow(0 20px 40px rgba(15,30,60,0.10))}

/* stat cards */
.stats-outer{padding:32px 0 0;position:relative;z-index:2}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm)}
.stat .sico{width:38px;height:38px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;flex:0 0 38px}
.stat.g .sico{background:var(--up-soft);color:#0E9760}
.stat .sico svg{width:18px;height:18px}
.stat-body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.stat-num-row{display:flex;align-items:baseline;gap:10px}
.stat-num{font-size:30px;font-weight:700;letter-spacing:-0.035em;color:var(--ink);line-height:1}
.stat-delta{display:inline-flex;align-items:center;gap:3px;color:var(--up);font-size:12.5px;font-weight:700}
.stat-live{display:inline-flex;align-items:center;gap:6px;color:var(--up);font-size:12px;font-weight:700}
.stat-live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px rgba(20,184,122,0.18);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.stat-live::before{animation:none}}
.stat-lab{color:var(--ink-mute);font-size:13px;font-weight:500}

/* how it works steps */
.section{padding:76px 0 32px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px}
.steps-grid{display:grid;grid-template-columns:1fr 26px 1fr 26px 1fr;gap:0;align-items:stretch}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 24px;position:relative;box-shadow:var(--shadow-sm)}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;position:absolute;top:-12px;left:22px;box-shadow:0 3px 8px rgba(61,124,255,0.32)}
.step .ico{width:46px;height:46px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;margin:6px 0 14px}
.step .ico svg{width:22px;height:22px}
.step h3{font-size:16.5px;font-weight:700;letter-spacing:-0.015em;color:var(--ink);margin-bottom:6px;line-height:1.3}
.step p{color:var(--ink-2);font-size:14px;line-height:1.55}
.step-arrow{display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
.step-arrow svg{width:20px;height:20px}

/* opportunity cards (warm glow) */
.opp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.opp{background:var(--card);border:1px solid rgba(230,138,82,0.55);border-radius:14px;padding:18px 18px 16px;box-shadow:var(--glow-warm);cursor:pointer;transition:border-color .18s ease,box-shadow .22s ease,transform .16s ease}
.opp:hover{border-color:rgba(232,96,36,0.75);box-shadow:var(--glow-warm-hover);transform:translateY(-2px)}
.opp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.opp-brand{display:flex;align-items:center;gap:10px;min-width:0}
.opp-favi{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 32px;background:#FFE9D9}
.opp-name{font-weight:700;font-size:14.5px;color:var(--ink);line-height:1.15}
.opp-loc{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-mute);font-weight:500;margin-top:2px}
.opp-chips{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 6px}
.opp-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);margin-top:6px}
.opp-metric b{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-0.03em;display:block;line-height:1.1;margin-bottom:2px}
.opp-metric span{color:var(--ink-mute);font-size:11.5px;font-weight:500;line-height:1.2;display:block}
.opp-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opp-btn{padding:8px 0;text-align:center;font-weight:600;font-size:12.5px;border-radius:8px;border:1px solid transparent}
.opp-btn.have{background:#F1F5FA;color:var(--ink-2);border-color:var(--line)}
.opp-btn.want{background:var(--blue);color:#fff}
.opp-btn.on{background:var(--up-soft);color:#0E9760;border-color:rgba(20,184,122,0.28)}

/* CTA band */
.cta-band{background:linear-gradient(135deg,#E8F0FA 0%,#F5F8FC 40%,#EAF6FF 100%);border:1px solid var(--line);border-radius:16px;margin-top:40px;padding:26px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;position:relative;overflow:hidden}
.cta-body h3{font-size:20px;font-weight:800;letter-spacing:-0.02em;color:var(--ink);margin-bottom:4px}
.cta-body p{font-size:14px;color:var(--ink-2)}
.cta-annot{font-family:var(--f-annot);font-style:italic;color:#E85F8A;font-size:18px;line-height:1.15;max-width:140px;transform:rotate(-3deg);text-align:left}

/* MARKETS */
.mk-hero{padding:44px 0 40px}
.mk-hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:44px;align-items:center}
h1.mk-h{font-size:clamp(36px,4.2vw,54px);font-weight:700;line-height:1.02;letter-spacing:-0.045em;color:var(--ink);margin-bottom:20px;text-wrap:balance}
.mk-lede{font-size:16px;line-height:1.6;color:var(--ink-2);max-width:40ch;margin-bottom:28px}
.mk-legend{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-sm);max-width:320px}
.mk-legend .row{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.mk-legend .dot{width:12px;height:12px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(61,124,255,0.16)}
.mk-legend p{color:var(--ink-mute);font-size:12.5px;margin-top:8px;line-height:1.4}
.mk-map img{width:100%;height:auto;display:block}
.mk-side-row{display:grid;grid-template-columns:minmax(0,0.7fr) minmax(0,1.3fr);gap:20px;padding-top:8px}
.mk-tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm)}
.mk-tile .ico{width:44px;height:44px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;flex:0 0 44px}
.mk-tile .ico svg{width:20px;height:20px}
.mk-tile .n{font-size:28px;font-weight:700;letter-spacing:-0.035em;color:var(--ink);line-height:1}
.mk-tile .l{color:var(--ink-mute);font-size:13.5px;margin-top:4px}
.mk-top{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 12px;box-shadow:var(--shadow-sm)}
.mk-top .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mk-top .head h3{display:inline-flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700;letter-spacing:-0.015em;color:var(--ink)}
.mk-top .head h3 svg{width:15px;height:15px;color:var(--blue)}
.mk-top .view-all{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--blue);padding:5px 10px;border:1px solid var(--line);border-radius:8px}
.mk-top-table{width:100%;border-collapse:collapse;font-size:13px}
.mk-top-table th{text-align:left;padding:6px 4px 8px;font-family:var(--f-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-mute);font-weight:400;border-bottom:1px solid var(--line)}
.mk-top-table th.num{text-align:right}
.mk-top-table td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.mk-top-table tbody tr:last-child td{border-bottom:0}
.mk-top-table td.rank{color:var(--ink-mute);width:22px;font-family:var(--f-mono);font-size:11px}
.mk-top-table td.country{font-weight:600;color:var(--ink)}
.mk-top-table td.num{text-align:right;font-weight:700;letter-spacing:-0.02em}
.mk-top-table td.trend{text-align:right;color:var(--up);width:24px}
.mk-top-table td.trend svg{width:14px;height:14px;vertical-align:middle}
.mk-row-link{cursor:pointer}
.mk-row-link:hover{background:#F5F8FC}

/* marquee */
.marquee-outer{padding:32px 0 12px}
.marquee{position:relative;overflow:hidden;padding:20px 0;background:linear-gradient(90deg,rgba(255,138,66,0.06) 0%,rgba(61,124,255,0.04) 50%,rgba(255,138,66,0.06) 100%);border-top:1px solid var(--line);border-bottom:1px solid var(--line);mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%)}
.marquee-track{display:flex;gap:14px;width:max-content;animation:marquee 90s linear infinite}
.marquee-outer:hover .marquee-track{animation-play-state:paused}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marquee-track{animation:none}}
.mq-item{display:inline-flex;align-items:center;gap:10px;flex:0 0 auto;padding:9px 18px;background:var(--card);border:1px solid var(--line);border-radius:999px;font-size:13.5px;color:var(--ink-2);box-shadow:var(--shadow-sm);text-decoration:none}
.mq-item:hover{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,124,255,0.08)}
.mq-flag{font-size:20px;line-height:1;font-family:var(--f-flag)}
.mq-name{color:var(--ink);font-weight:600}
.mq-sep{color:var(--ink-faint)}
.mq-tf{color:var(--blue);font-weight:600;font-family:var(--f-mono);font-size:12.5px}

/* all markets table */
.mk-all{padding:30px 0 60px}
.mk-all-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:24px}
.mk-all-head h2{font-size:26px;font-weight:700;letter-spacing:-0.03em;color:var(--ink);line-height:1.1;margin-bottom:4px}
.mk-all-head .sub{font-size:13.5px;color:var(--ink-mute)}
.mk-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;margin-bottom:18px;align-items:stretch}
.mk-search{display:inline-flex;align-items:center;gap:10px;padding:0 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;transition:border-color .16s ease,box-shadow .16s ease}
.mk-search:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(61,124,255,0.10)}
.mk-search svg{width:16px;height:16px;color:var(--ink-mute);flex:0 0 16px}
.mk-search input{flex:1;padding:12px 0;border:0;outline:0;background:transparent;font-size:15px;color:var(--ink)}
.mk-search input::placeholder{color:var(--ink-mute)}
.mk-dd{position:relative;display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 34px 0 16px}
.mk-dd:hover,.mk-dd:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(61,124,255,0.08)}
.mk-dd select{appearance:none;-webkit-appearance:none;background:transparent;border:0;outline:0;font-size:14.5px;font-weight:600;color:var(--ink);padding:12px 0;cursor:pointer}
.mk-dd .dd-caret{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:12px;height:12px;color:var(--ink-mute);pointer-events:none}
.mk-table-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden}
.mk-table{width:100%;border-collapse:collapse;font-size:14.5px}
.mk-table thead th{text-align:left;padding:16px 20px;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;color:var(--ink-mute);background:#FAFCFE;border-bottom:1px solid var(--line)}
.mk-table thead th.sortable{color:var(--blue);cursor:pointer}
.mk-table tbody td{padding:16px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
.mk-table tbody tr:last-child td{border-bottom:0}
.mk-table tbody tr:hover{background:#F9FBFD}
.mk-table td.rank{color:var(--ink-mute);font-family:var(--f-mono);font-size:12px;width:40px}
.mk-table td.country-c .cwrap{display:inline-flex;align-items:center;gap:12px}
.mk-table td.country-c .cname{font-weight:600;color:var(--ink)}
.mk-table td.num-c{font-weight:700;letter-spacing:-0.02em;font-size:15px}
.mk-table td.tf{font-weight:600;letter-spacing:-0.015em;font-size:15px;color:var(--ink)}
.trend-cell svg{width:100px;height:30px}
.trend-cell .path-up{stroke:var(--up);fill:none}
.view-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--card);border:1px solid var(--line-strong);border-radius:8px;font-size:12.5px;font-weight:600;color:var(--blue)}
.view-btn:hover{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,124,255,0.08)}

/* MARKET DETAIL */
.mkd-back{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:600;font-size:14px;margin:32px 0 20px;cursor:pointer}
.mkd-back:hover{color:var(--blue)}
.mkd-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:end;margin-bottom:32px;padding-bottom:32px;border-bottom:1px solid var(--line)}
.mkd-title-row{display:flex;align-items:center;gap:20px;margin-bottom:14px}
.mkd-flag-hero{font-size:64px;line-height:1;font-family:var(--f-flag);filter:drop-shadow(0 4px 12px rgba(15,30,60,0.10))}
.mkd-h{font-size:clamp(38px,4.6vw,60px);font-weight:700;letter-spacing:-0.045em;color:var(--ink);line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mkd-lede{font-size:16.5px;line-height:1.6;color:var(--ink-2);max-width:56ch}
.mkd-lede b{color:var(--ink);font-weight:600}
.mkd-hero-side{display:flex;justify-content:flex-end}
.mkd-badge{background:linear-gradient(135deg,#F5EFFF 0%,#EAF1FA 100%);border:1px solid rgba(139,92,246,0.24);border-radius:14px;padding:16px 22px;text-align:right;box-shadow:0 4px 14px rgba(139,92,246,0.10)}
.mkd-badge-l{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--violet-hi);font-weight:600;display:block;margin-bottom:4px}
.mkd-badge-v{font-size:24px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);display:block;line-height:1}
.mkd-badge-c{color:var(--ink-mute);font-size:12.5px;display:block;margin-top:4px}

.mkd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.mkd-stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm);transition:transform .16s ease,box-shadow .16s ease}
.mkd-stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.mkd-stat-ico{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 44px}
.mkd-stat-ico svg{width:22px;height:22px}
.mkd-stat-ico.b{background:var(--blue-soft);color:var(--blue)}
.mkd-stat-ico.p{background:#F5EFFF;color:var(--violet-hi)}
.mkd-stat-ico.k{background:#FEEBE9;color:#E85F8A}
.mkd-stat-ico.g{background:var(--up-soft);color:#0E9760}
.mkd-stat-l{color:var(--ink-mute);font-size:12px;font-weight:500;letter-spacing:-0.005em;margin-bottom:4px}
.mkd-stat-n{font-size:28px;font-weight:700;letter-spacing:-0.035em;color:var(--ink);line-height:1}

.mkd-pills{display:flex;gap:8px;margin:20px 0 16px;flex-wrap:wrap}
.mkd-pill{padding:10px 18px;background:var(--card);border:1px solid var(--line);color:var(--ink-2);font-weight:600;font-size:13.5px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .16s ease,color .16s ease,box-shadow .16s ease}
.mkd-pill:hover{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px rgba(61,124,255,0.08)}
.mkd-pill.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:var(--glow-blue)}
.mkd-pill.on .n{color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.16)}
.mkd-pill .n{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:2px 8px;background:var(--blue-softer);color:var(--blue);border-radius:999px}

/* List / grid view toggle */
.mkd-viewtog{display:inline-flex;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-left:auto}
.mkd-viewtog button{width:36px;height:32px;padding:0;background:transparent;border:0;border-radius:7px;color:var(--ink-mute);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .16s ease,color .16s ease}
.mkd-viewtog button svg{width:16px;height:16px}
.mkd-viewtog button:hover{color:var(--ink)}
.mkd-viewtog button.on{background:var(--ground);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

/* Card grid view for the country page */
.mkd-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.mkd-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;box-shadow:var(--shadow-sm);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;cursor:pointer;display:flex;flex-direction:column;position:relative;overflow:hidden}
.mkd-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#6D28D9,#3D7CFF,#00D9FF);opacity:0;transition:opacity .16s ease}
.mkd-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(20,30,50,0.09);border-color:rgba(61,124,255,0.28)}
.mkd-card:hover::before{opacity:1}
.mkd-card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mkd-card .mkd-fav{width:44px;height:44px;flex:0 0 44px;border-radius:11px}
.mkd-card .mkd-fav img{width:24px;height:24px}
.mkd-card .mkd-fav .mkd-mono{font-size:17px}
.mkd-card-id{min-width:0;flex:1}
.mkd-card-id b{display:block;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-0.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.mkd-card-id span{display:block;font-size:12px;color:var(--ink-mute);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.mkd-card-verts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;min-height:24px}
.mkd-card-verts .chip{background:var(--blue-softer);color:var(--blue);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;letter-spacing:0}
.mkd-card-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;padding:10px 12px;background:var(--ground);border-radius:10px}
.mkd-card-metric b{display:block;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-0.02em;line-height:1}
.mkd-card-metric span{display:block;font-size:10px;font-weight:500;color:var(--ink-mute);letter-spacing:0.06em;text-transform:uppercase;margin-top:4px}
.mkd-card-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mkd-card-acts .mkd-btn{width:100%;text-align:center;padding:9px 0}

/* site rows inside market detail */
.mkd-site{display:inline-flex;align-items:center;gap:12px;min-width:0}
.mkd-fav{position:relative;width:40px;height:40px;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:0 0 40px}
.mkd-fav img{width:22px;height:22px;object-fit:contain;display:block}
.mkd-fav .mkd-mono{display:none;width:100%;height:100%;color:#fff;font-weight:700;font-size:16px;align-items:center;justify-content:center;letter-spacing:-0.01em}
.mkd-fav.is-fallback{border:0}
.mkd-fav.is-fallback img{display:none}
.mkd-fav.is-fallback .mkd-mono{display:flex}
.mkd-site-info{display:flex;flex-direction:column;min-width:0}
.mkd-site-info b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:-0.015em;line-height:1.2}
.mkd-site-info span{color:var(--ink-mute);font-size:13px;font-weight:500;letter-spacing:-0.005em;margin-top:3px;font-feature-settings:"cv11" 1}
.mkd-tf{display:flex;align-items:center;gap:12px;min-width:180px}
.mkd-tf b{color:var(--ink);font-weight:700;letter-spacing:-0.02em;font-size:15px;flex:0 0 auto;min-width:52px}
.mkd-bar{flex:1;background:var(--line);height:8px;border-radius:999px;overflow:hidden;min-width:60px}
.mkd-bar i{background:linear-gradient(90deg,var(--blue) 0%,var(--blue-cyan) 100%);height:100%;display:block;border-radius:999px}
.mkd-auth{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 12px;background:var(--blue-softer);color:var(--blue-hi);font-weight:700;font-size:14.5px;font-family:var(--f-mono);border-radius:999px;letter-spacing:-0.02em}
.mkd-acts{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.mkd-visit{width:32px;height:32px;background:var(--card);border:1px solid var(--line);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-mute)}
.mkd-visit svg{width:12px;height:12px}
.mkd-visit:hover{color:var(--blue);border-color:var(--blue)}
.mkd-btn{padding:8px 14px;border-radius:8px;font-weight:600;font-size:12.5px;border:1px solid transparent;cursor:pointer;transition:background .16s ease,color .16s ease,box-shadow .16s ease}
.mkd-btn.have{background:var(--card);color:var(--ink-2);border-color:var(--line)}
.mkd-btn.have:hover{border-color:var(--blue);color:var(--blue)}
.mkd-btn.want{background:var(--blue);color:#fff}
.mkd-btn.want:hover{background:var(--blue-hi);box-shadow:var(--glow-blue)}
.mkd-btn.on{background:var(--up-soft);color:#0E9760;border-color:rgba(20,184,122,0.28);box-shadow:none}

/* market detail table override */
.mk-table td{padding:14px 20px}
.mk-table thead th{padding:14px 20px;background:#FAFCFE}

.mkd-footer-cta{background:linear-gradient(135deg,#E8F0FA 0%,#F5F8FC 40%,#EAF6FF 100%);border:1px solid var(--line);border-radius:16px;margin-top:32px;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;gap:24px;box-shadow:0 4px 16px rgba(61,124,255,0.08)}
.mkd-footer-cta h3{font-size:20px;font-weight:800;letter-spacing:-0.02em;color:var(--ink);margin-bottom:4px}
.mkd-footer-cta p{color:var(--ink-2);font-size:14px}


/* SITE PROFILE */
.sp-back{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:600;font-size:14px;margin:32px 0 20px;cursor:pointer}
.sp-back:hover{color:var(--blue)}
.sp-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:start}
.sp-hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow-sm)}
.sp-shot{background:linear-gradient(180deg,#F8FAFD,#EEF2F8);border-radius:10px;padding:12px;min-height:180px;display:flex;align-items:center;justify-content:center}
.sp-shot .letter{width:80px;height:80px;border-radius:16px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800}
.sp-name{font-size:32px;font-weight:700;letter-spacing:-0.03em;color:var(--ink);line-height:1.05;margin-top:16px}
.sp-domain{color:var(--ink-mute);font-family:var(--f-mono);font-size:13.5px;margin-top:4px;display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap}
.sp-visit{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:600;font-size:13px}
.sp-rating{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px}
.sp-rating .label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-mute);font-weight:600}
.sp-rating .val{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-0.02em;margin-top:2px}
.sp-chart-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow-sm)}
.sp-etv{font-size:32px;font-weight:800;letter-spacing:-0.03em;color:var(--ink);line-height:1}
.sp-etv .u{color:var(--ink-mute);font-size:14px;margin-left:6px;font-weight:600}
.sp-chart{margin-top:16px;height:120px}
.sp-markets-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow-sm);margin-top:16px}
.sp-markets-card h4{font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:var(--ink-mute);font-family:var(--f-mono);margin-bottom:14px;font-weight:500}
.sp-mkt-row{display:grid;grid-template-columns:32px 1fr 60px 80px;gap:12px;align-items:center;padding:8px 0}
.sp-mkt-bar{background:var(--line);height:6px;border-radius:6px;overflow:hidden}
.sp-mkt-bar i{background:var(--blue);height:100%;display:block}
.sp-mkt-etv{text-align:right;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--ink)}
.sp-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.sp-btn{padding:14px 20px;text-align:center;font-weight:600;font-size:14.5px;border-radius:10px;cursor:pointer;border:1px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px}
.sp-btn.want{background:var(--blue);color:#fff;box-shadow:var(--glow-blue)}
.sp-btn.have{background:var(--card);color:var(--ink);border-color:var(--line-strong)}
.sp-btn.on{background:var(--up-soft);color:#0E9760;border-color:rgba(20,184,122,0.28);box-shadow:none}
.sp-locked{background:var(--blue-softer);border:1px dashed var(--line-strong);padding:14px 16px;border-radius:10px;text-align:center;color:var(--ink-mute);font-size:13.5px;font-weight:500;margin-top:12px}

/* SWAPS */
.sw-hero{padding:32px 0 24px}
.sw-hero h1{font-size:36px;font-weight:700;letter-spacing:-0.03em;color:var(--ink);line-height:1.05}
.sw-hero .sub{color:var(--ink-2);font-size:15px;margin-top:6px}
.sw-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px}
.match-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.match-card.match-new{border-color:rgba(229,72,77,0.32);box-shadow:0 4px 20px rgba(229,72,77,0.10),0 0 0 3px rgba(229,72,77,0.05)}
.match-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.mstat{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;letter-spacing:0}
.mstat-new{background:rgba(229,72,77,0.10);color:#C53034;border:1px solid rgba(229,72,77,0.22)}
.mstat-wait{background:rgba(217,119,6,0.10);color:#B45309;border:1px solid rgba(217,119,6,0.22)}
.mstat-done{background:var(--up-soft);color:#0E9760;border:1px solid rgba(20,184,122,0.22)}
.match-card .who{color:var(--ink-mute);font-size:13px}
.match-card .who b{color:var(--ink)}
.match-row{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-bottom:16px}
.match-tile{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:14px}
.match-tile .lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:6px}
.match-tile.get .lbl{color:var(--up)}
.match-tile .dom{font-weight:700;color:var(--ink);font-size:15px}
.match-arrow{color:var(--blue)}
.match-arrow svg{width:28px;height:28px}
.match-btn{width:100%;padding:12px;background:var(--blue);color:#fff;border:0;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--glow-blue)}
.match-btn:disabled{background:var(--blue-soft);color:var(--blue-hi);box-shadow:none;cursor:default}
.sw-empty{background:var(--card);border:1px dashed var(--line-strong);border-radius:14px;padding:40px;text-align:center;color:var(--ink-mute)}

/* Want / Have lists on Swaps view */
.lists-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow-sm)}
.list-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.list-head h3{display:inline-flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);margin-bottom:4px}
.list-head p{color:var(--ink-mute);font-size:12.5px;line-height:1.45;max-width:36ch}
.list-n{background:var(--blue-softer);color:var(--blue);font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:4px}
.dot-blue{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(61,124,255,0.16)}
.dot-green{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px rgba(20,184,122,0.16)}
.list-body{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding-right:4px}
.list-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto 26px;gap:10px;align-items:center;padding:10px 12px;background:var(--ground);border:1px solid transparent;border-radius:10px;transition:border-color .16s ease,background .16s ease}
.list-row:hover{background:#F1F5FA;border-color:var(--line)}
.list-fav{width:36px;height:36px;border-radius:8px;color:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.list-info{min-width:0;cursor:pointer;display:flex;flex-direction:column}
.list-info b{color:var(--ink);font-weight:600;font-size:14px;letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-info span{color:var(--ink-mute);font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-meta{font-family:var(--f-mono);font-size:12px;color:var(--ink-mute);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.list-meta b{color:var(--ink);font-weight:600}
.list-x{width:24px;height:24px;border-radius:6px;background:transparent;border:1px solid var(--line);color:var(--ink-mute);font-size:16px;line-height:1;padding:0;cursor:pointer;transition:background .16s ease,color .16s ease,border-color .16s ease}
.list-x:hover{background:#FEECEC;color:#E5484D;border-color:#F5B5B7}

/* LOYALTY */
.loy-hero{padding:32px 0 24px}
.loy-hero h1{font-size:36px;font-weight:700;letter-spacing:-0.03em;color:var(--ink)}
.loy-hero .sub{color:var(--ink-2);font-size:15px;margin-top:6px}
.loy-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow-sm);margin-bottom:16px}
.loy-progress{background:#E9F0F9;border-radius:8px;height:12px;overflow:hidden;margin-bottom:8px}
.loy-progress i{background:var(--grad);height:100%;display:block;transition:width .4s}

/* LOYALTY — stamp card */
.stamp-card{background:linear-gradient(135deg,#FFFFFF 0%,#FBF7EF 100%);border:1px solid rgba(230,138,82,0.35);border-radius:20px;padding:32px;box-shadow:var(--glow-warm);position:relative;overflow:hidden;margin-bottom:32px}
.stamp-card::before{content:"";position:absolute;top:-50%;right:-20%;width:60%;height:200%;background:radial-gradient(circle at center,rgba(232,182,47,0.14) 0%,transparent 60%);pointer-events:none}
.stamp-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:28px;position:relative}
.stamp-eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#B47B00;margin-bottom:8px}
.stamp-title{font-size:36px;font-weight:700;letter-spacing:-0.03em;color:var(--ink);line-height:1;margin-bottom:8px}
.stamp-sub{color:var(--ink-2);font-size:15px;max-width:44ch}
.stamp-badge{background:var(--card);border:1px solid rgba(230,138,82,0.4);border-radius:16px;padding:14px 20px;text-align:center;box-shadow:0 4px 16px rgba(255,138,66,0.16);min-width:130px}
.stamp-badge-n{font-size:44px;font-weight:800;letter-spacing:-0.04em;color:var(--up);line-height:1}
.stamp-badge-l{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-mute);font-weight:600;margin-top:4px;line-height:1.3}
.stamps-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:8px 0;position:relative}
.stamp{aspect-ratio:1/1;background:var(--card);border:2px dashed rgba(230,138,82,0.32);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .3s ease}
.stamp-n{font-family:var(--f-mono);font-size:20px;font-weight:600;color:rgba(230,138,82,0.55)}
.stamp.on{background:linear-gradient(135deg,#FFE7A6,#FFB84D);border-style:solid;border-color:transparent;color:#7A4A00;box-shadow:0 8px 22px rgba(255,168,66,0.4), 0 0 0 3px rgba(255,255,255,0.7) inset;transform:rotate(-6deg)}
.stamp.on svg{width:60%;height:60%}
.stamp.on:nth-child(even){transform:rotate(5deg)}
.stamp-legend{display:flex;align-items:center;gap:16px;margin-top:24px;padding-top:20px;border-top:1px dashed rgba(230,138,82,0.28);font-size:13.5px;color:var(--ink-2)}
.stamp-legend b{color:var(--ink);font-weight:700}
.stamp-legend-sep{color:var(--ink-faint)}
.tick-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-right:4px;vertical-align:middle;box-shadow:0 0 0 3px rgba(20,184,122,0.16)}
.loy-earn{margin-bottom:24px}
.loy-earn-head{margin-bottom:20px}
.loy-earn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.loy-earn-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow-sm);position:relative;transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease}
.loy-earn-card:hover{border-color:var(--blue);box-shadow:0 8px 24px rgba(61,124,255,0.14);transform:translateY(-2px)}
.loy-earn-ico{width:44px;height:44px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px}
.loy-earn-ico svg{width:22px;height:22px}
.loy-earn-worth{position:absolute;top:22px;right:22px;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--up);background:var(--up-soft);padding:4px 10px;border-radius:999px;letter-spacing:-0.005em}
.loy-earn-card h4{font-size:16px;font-weight:700;letter-spacing:-0.015em;color:var(--ink);margin-bottom:6px}
.loy-earn-card p{color:var(--ink-2);font-size:13.5px;line-height:1.5;margin-bottom:14px}
.loy-earn-cta{color:var(--blue);font-weight:600;font-size:13.5px;cursor:pointer}
.loy-earn-cta:hover{color:var(--blue-hi)}

/* ACCOUNT / SIGNUP form */
.form-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow-sm);max-width:640px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px;letter-spacing:-0.005em}
.field .inp{display:flex;align-items:center;background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:0 14px}
.field .inp:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(61,124,255,0.10)}
.field .inp input,.field .inp select{width:100%;border:0;outline:0;background:transparent;padding:11px 0;font-size:14.5px;color:var(--ink)}
.form-msg{font-size:13.5px;color:var(--ink-mute);margin-top:12px;min-height:1.2em}
.form-msg.err{color:var(--warn)}

/* LinkedIn button + separator */
.btn-linkedin{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 20px;background:#0A66C2;color:#fff;font-family:var(--f-body);font-weight:600;font-size:14.5px;border:0;border-radius:12px;cursor:pointer;text-decoration:none;box-shadow:0 4px 14px rgba(10,102,194,0.35);transition:background .16s ease,box-shadow .16s ease,transform .06s ease;margin-bottom:16px}
.btn-linkedin:hover{background:#08528E;box-shadow:0 6px 20px rgba(10,102,194,0.5)}
.btn-linkedin:active{transform:translateY(1px)}
.btn-linkedin svg{flex:0 0 18px}
.li-hint{color:var(--ink-mute);font-size:12.5px;line-height:1.5;margin-bottom:20px;text-align:center;max-width:44ch;margin-left:auto;margin-right:auto}
.li-warn{background:#FEF6E7;border:1px solid #F5C67B;border-radius:10px;padding:12px 14px;font-size:13px;color:#7A5000;margin-bottom:16px}
.or-sep{display:flex;align-items:center;gap:14px;margin:8px 0 20px;color:var(--ink-mute);font-size:12px;font-weight:600;letter-spacing:0.02em;text-transform:uppercase}
.or-sep::before,.or-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.or-sep span{padding:0 4px}
.legal-hint{color:var(--ink-mute);font-size:12px;line-height:1.5;text-align:center;margin-top:16px}
.legal-hint a{color:var(--blue);font-weight:600;cursor:pointer;text-decoration:none}
.legal-hint a:hover{text-decoration:underline}

/* Long-form legal / policy pages */
.doc{max-width:720px;margin:0 auto;padding:48px 0 80px}
.doc-eyebrow{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--blue);margin-bottom:16px}
.doc-h1{font-size:clamp(32px,4vw,44px);font-weight:700;letter-spacing:-0.035em;color:var(--ink);line-height:1.05;margin-bottom:18px;text-wrap:balance}
.doc-lede{font-size:17.5px;line-height:1.55;color:var(--ink-2);max-width:60ch;margin-bottom:12px}
.doc-meta{color:var(--ink-mute);font-size:13px;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:24px}
.doc h2{font-size:22px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);margin:36px 0 12px}
.doc h3{font-size:16px;font-weight:700;color:var(--ink);margin:20px 0 8px}
.doc p{color:var(--ink-2);font-size:15.5px;line-height:1.7;margin-bottom:12px;max-width:65ch}
.doc p b{color:var(--ink);font-weight:600}
.doc a{color:var(--blue);font-weight:500}
.doc a:hover{color:var(--blue-hi)}
.doc-list{padding-left:22px;margin-bottom:14px}
.doc-list li{color:var(--ink-2);font-size:15.5px;line-height:1.65;margin-bottom:8px;list-style:disc;max-width:60ch}
.doc-list li b{color:var(--ink);font-weight:600}
.doc code{font-family:var(--f-mono);font-size:13px;background:var(--blue-softer);padding:2px 6px;border-radius:4px;color:var(--ink)}
.doc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:48px;padding-top:24px;border-top:1px solid var(--line);gap:24px}
.doc-foot span{color:var(--ink-mute);font-size:13px}

/* ACCOUNT (rich) */
.acct-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
.acct-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:box-shadow .2s ease}
.acct-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);opacity:0;transition:opacity .2s ease}
.acct-card:hover{box-shadow:var(--shadow-md)}
.acct-card:hover::before{opacity:1}
.acct-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.acct-card-head h2{font-size:18px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);margin-bottom:4px}
.acct-card-head p{color:var(--ink-mute);font-size:13px;line-height:1.45}
.acct-card-head .ico-hero{width:38px;height:38px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;flex:0 0 38px}
.acct-card-head .ico-hero svg{width:18px;height:18px}
.li-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:var(--blue-softer);border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-2)}
.acct-form{display:grid;grid-template-columns:150px 1fr;gap:24px}
.acct-avatar{text-align:center}
.ph-wrap{position:relative;display:inline-block}
.ph{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#6D28D9,#3D7CFF);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:32px;letter-spacing:-0.02em}
.ph-img{width:88px;height:88px;border-radius:50%;object-fit:cover;display:block}
.li-mini{position:absolute;bottom:0;right:-4px;width:24px;height:24px;background:#0A66C2;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff}
.acct-hint{color:var(--ink-mute);font-size:11.5px;margin-top:6px;line-height:1.4}
.acct-fields{display:flex;flex-direction:column;gap:12px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chipbox{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--ground);border:1px solid var(--line);border-radius:10px;min-height:44px;align-items:center}
.chipbox.mirror{background:transparent;border:0;padding:0}
.mchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink)}
.mchip .x{margin-left:4px;color:var(--ink-mute);cursor:pointer;font-weight:400}
.mchip .x:hover{color:var(--warn)}
.addmk{background:transparent;border:1px dashed var(--line-strong);color:var(--blue);font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer}
.addmk:hover{border-color:var(--blue);background:var(--blue-softer)}
.mkmenu{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow-lg);margin-top:6px;max-height:240px;overflow-y:auto;z-index:20;min-width:200px}
.mkmenu button{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;padding:8px 10px;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left;border-radius:8px}
.mkmenu button:hover{background:var(--blue-softer)}
.acct-lab{font-size:14px;font-weight:700;color:var(--ink);margin:16px 0 4px}
.acct-sub{color:var(--ink-mute);font-size:12.5px;margin-bottom:12px}
.alerts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.altrow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--ground);border:1px solid var(--line);border-radius:10px}
.altrow .at b{font-size:13px;color:var(--ink);display:block;font-weight:600}
.altrow .at span{color:var(--ink-mute);font-size:11.5px;line-height:1.3;display:block}
.switch{width:36px;height:20px;background:var(--line);border-radius:999px;position:relative;cursor:pointer;transition:background .16s ease;flex:0 0 36px}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .16s ease;box-shadow:var(--shadow-sm)}
.switch.on{background:var(--blue)}
.switch.on::after{transform:translateX(16px)}
.acct-arow{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:18px}
.seg{display:inline-flex;background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{background:transparent;border:0;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink-mute);border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:var(--shadow-sm)}
.savebtn{width:100%;margin-top:20px}
.acct-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.acct-stats .lbl{color:var(--ink-mute);font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;font-family:var(--f-mono);margin-bottom:4px}
.acct-stats .val{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-0.03em}

/* Compact stamp card inside Account swaps-and-loyalty card */
.loy-mini{margin-top:18px;padding:16px 18px;background:linear-gradient(135deg,#FFFDF5,#FBF6EA);border:1px solid rgba(230,138,82,0.30);border-radius:12px}
.loy-mini-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.loy-mini-head b{display:block;font-size:14px;font-weight:700;letter-spacing:-0.015em;color:var(--ink);margin-bottom:2px}
.loy-mini-head span{color:var(--ink-mute);font-size:12.5px;line-height:1.4}
.loy-mini-count{font-family:var(--f-mono);font-size:13px;font-weight:700;color:#B47B00;background:var(--card);padding:6px 12px;border-radius:999px;border:1px solid rgba(230,138,82,0.28)}
.loy-mini-stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mini-stamp{aspect-ratio:1/1;background:var(--card);border:2px dashed rgba(230,138,82,0.30);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:14px;font-weight:500;color:rgba(230,138,82,0.55)}
.mini-stamp.on{background:linear-gradient(135deg,#FFE7A6,#FFB84D);border-style:solid;border-color:transparent;color:#7A4A00;font-family:var(--f-body);font-size:18px;box-shadow:0 4px 12px rgba(255,168,66,0.35)}

/* Account Your-lists summary card */
.acct-lists{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acct-list-tile{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--ground)}
.acct-list-tile.blue{border-color:rgba(61,124,255,0.24);background:#F5F9FF}
.acct-list-tile.green{border-color:rgba(20,184,122,0.22);background:#F1FAF5}
.acct-list-top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.acct-list-top b{flex:1;font-weight:600}
.acct-list-n{background:var(--card);color:var(--ink);font-family:var(--f-mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.acct-list-preview{display:flex;flex-direction:column;gap:6px}
.acct-list-preview a{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;padding:4px 0}
.acct-list-preview a:hover{color:var(--blue)}
.acct-list-preview a .mq-flag{font-size:16px}
.acct-list-etv{margin-left:auto;color:var(--ink-mute);font-family:var(--f-mono);font-size:11.5px;font-weight:500}
.acct-list-more{color:var(--ink-mute);font-size:12px;margin-top:6px;font-weight:500}
.acct-list-empty{color:var(--ink-mute);font-size:13px;padding:8px 0}

/* Account tab bar */
.acct-tabs{display:flex;gap:4px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:24px 0 22px;box-shadow:var(--shadow-sm);overflow-x:auto;scrollbar-width:none}
.acct-tabs::-webkit-scrollbar{display:none}
.acct-tab{flex:1;min-width:0;padding:11px 16px;font-family:var(--f-body);font-size:13.5px;font-weight:600;letter-spacing:-0.005em;color:var(--ink-mute);border-radius:10px;cursor:pointer;background:transparent;border:0;text-align:center;transition:all .16s ease;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.acct-tab:hover{color:var(--ink)}
.acct-tab.on{color:var(--ink);background:var(--ground);box-shadow:inset 0 0 0 1px var(--line)}
.acct-tab svg{width:15px;height:15px;flex:0 0 15px;opacity:.85}
.acct-tab .tab-badge{background:var(--warn);color:#fff;font-family:var(--f-mono);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;line-height:1.4;letter-spacing:0}
.acct-tab.on .tab-badge{background:var(--blue)}
/* Pulsing red dot — signals a match awaiting your action */
.acct-tab .tab-dot{width:8px;height:8px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 0 rgba(229,72,77,0.55);animation:tabDotPulse 1.6s ease-out infinite;flex:0 0 8px}
.acct-tab.on .tab-dot{background:#E5484D}
@keyframes tabDotPulse{
  0%{box-shadow:0 0 0 0 rgba(229,72,77,0.55)}
  70%{box-shadow:0 0 0 6px rgba(229,72,77,0)}
  100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}
}
@media (prefers-reduced-motion:reduce){.acct-tab .tab-dot{animation:none}}
.acct-pane{animation:paneIn .18s ease}
@keyframes paneIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (max-width:640px){
  .acct-tabs{margin:16px 0}
  .acct-tab{padding:9px 12px;font-size:12.5px;gap:6px}
  .acct-tab svg{display:none}
}

/* Your lists — full-width vertical rows with real favicons */
.ll-section{padding:18px 20px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.ll-section + .ll-section{margin-top:14px}
.ll-section-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ll-section-head h3{font-size:14.5px;font-weight:700;letter-spacing:-0.01em;color:var(--ink);display:inline-flex;align-items:center;gap:8px;margin:0}
.ll-section-head h3 .dot-blue,.ll-section-head h3 .dot-green{width:8px;height:8px;border-radius:50%}
.ll-section-head h3 .dot-blue{background:var(--blue);box-shadow:0 0 0 3px rgba(61,124,255,0.16)}
.ll-section-head h3 .dot-green{background:#14B87A;box-shadow:0 0 0 3px rgba(20,184,122,0.16)}
.ll-count{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--blue-softer);color:var(--blue);margin-left:2px}
.ll-count.g{background:rgba(20,184,122,0.12);color:#0E9760}
.ll-section-head .ll-desc{color:var(--ink-mute);font-size:12.5px;font-weight:500;flex:1;max-width:32ch;line-height:1.4}
.ll-section-head .ll-add{margin-left:auto;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;padding:7px 12px;border-radius:8px;background:var(--blue-softer);white-space:nowrap;text-decoration:none;transition:background .16s ease}
.ll-section-head .ll-add:hover{background:rgba(61,124,255,0.16)}
.ll-rows{display:flex;flex-direction:column;gap:2px}
.ll-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto 28px;gap:14px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .16s ease}
.ll-row:hover{background:var(--ground)}
.ll-fav{position:relative;width:36px;height:36px;border-radius:9px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.ll-fav img{width:20px;height:20px;object-fit:contain;display:block}
.ll-fav .ll-mono{display:none;width:100%;height:100%;color:#fff;font-weight:700;font-size:14px;align-items:center;justify-content:center;letter-spacing:-0.01em}
.ll-fav.is-fallback{border:0}
.ll-fav.is-fallback img{display:none}
.ll-fav.is-fallback .ll-mono{display:flex}
.ll-body{min-width:0}
.ll-body b{display:block;color:var(--ink);font-size:14px;font-weight:600;letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.ll-body .ll-sub{display:block;color:var(--ink-mute);font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4;margin-top:2px}
.ll-body .ll-sub em{font-style:normal;color:var(--line-strong,#C7CDD6);margin:0 6px}
.ll-body .ll-sub .ll-flag{font-size:13px;margin-right:5px;position:relative;top:1px}
.ll-meta{text-align:right;white-space:nowrap;line-height:1.1}
.ll-meta b{display:block;color:var(--ink);font-size:14px;font-weight:700;letter-spacing:-0.02em}
.ll-meta span{color:var(--ink-mute);font-size:10.5px;font-weight:500;letter-spacing:0.02em;text-transform:uppercase}
.ll-x{width:26px;height:26px;border-radius:7px;background:transparent;border:1px solid transparent;color:var(--ink-mute);font-size:18px;line-height:1;padding:0;cursor:pointer;opacity:0;transition:all .16s ease}
.ll-row:hover .ll-x{opacity:1;border-color:var(--line)}
.ll-x:hover{background:#FEECEC;color:#E5484D;border-color:#F5B5B7}
.ll-empty{padding:22px 14px;text-align:center;color:var(--ink-mute);font-size:13px;background:var(--ground);border-radius:10px}
.ll-empty a{color:var(--blue);cursor:pointer;font-weight:600}
@media (max-width:640px){
  .ll-section-head{flex-wrap:wrap}

function h(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){n=+n||0;if(n>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1e3)return Math.round(n/1e3)+'K';return String(Math.round(n))}

  }).join('');
}

var ME=null;
function updateMeChip(){
  return apiGet('/api/me').then(function(m){
    ME=m;
    var el=document.getElementById('swaps-count');
    if(el) el.textContent = m.unlimited ? '∞' : (m.swaps==null?'—':m.swaps);
    // Refresh avatar in the nav — real photo if we have one, initials otherwise.
    var av=document.querySelector('.avatar-30');
    if(av){
      var handle = m.handle || 'You';
      if(m.avatar_url){
        av.innerHTML = '<img src="'+h(m.avatar_url)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.parentNode.textContent=\''+h(handle.charAt(0).toUpperCase())+'\'">';
        av.style.background = 'transparent';
      } else {
        var parts = handle.split(' ');
        var inits = parts.length>1 ? (parts[0].charAt(0)+parts[parts.length-1].charAt(0)) : (handle.charAt(0)+ (handle.charAt(1)||''));
        av.textContent = inits.toUpperCase();
      }
    }
    // Show login link if not authed, or hide if authed.
    var authLink=document.getElementById('auth-link');
    if(authLink) authLink.textContent = m.authed ? 'Sign out' : 'Sign in';
    // Red dot on the avatar chip when the member has pending matches
    // waiting for their action. Also update the browser tab title so
    // background tabs surface it.
    var dot=document.getElementById('nav-match-dot');
    var pm=+m.pending_matches||0;
    if(dot) dot.hidden = pm===0;
    var baseTitle='Affswap · Swap iGaming affiliate connections';
    document.title = pm>0 ? '('+pm+') '+baseTitle : baseTitle;
  }).catch(function(){});
}
function authAction(){

function hydrateHome(){
  apiGet('/api/home').then(function(d){
    var s=d.stats||{};
    var setN=function(id,v){var el=document.getElementById(id);if(el&&v!=null)el.textContent=fmtNum(v)};
    setN('h-managers',s.managers_joined);setN('h-sites',s.websites);setN('h-swaps',s.swaps_to_date);setN('h-online',s.online);
  }).catch(function(){});
  // Featured opportunities: pull top sites from a couple of markets
  Promise.all([apiGet('/api/geo?iso=GB'),apiGet('/api/geo?iso=US')]).then(function(res){
    var picks=[];
    var seen={};
    ['fotmob.com','crypto.news','sigma.world','next.io'].forEach(function(d){seen[d]=1;});
    [res[0],res[1]].forEach(function(d){
      var iso=d.country&&d.country.iso;
      (d.cards||[]).forEach(function(c){
        if(picks.length>=4||seen[c.domain])return;
        seen[c.domain]=1;
        picks.push({iso:iso,country:d.country.name,flag:d.country.flag,card:c});
      });
    });
    if(!picks.length){document.getElementById('opp-grid').innerHTML='<div class="stat" style="padding:24px">No opportunities loaded.</div>';return;}
    document.getElementById('opp-grid').innerHTML=picks.map(function(p){
      var c=p.card;
      var authority = c.etv>0 ? Math.round(Math.log10(c.etv+1)*10) : 0;
      var verticals = (c.verticals||[]).map(function(v){return '<span class="chip">'+h(v.charAt(0).toUpperCase()+v.slice(1))+'</span>'}).join('');
      var haveOn = c.you_have?' on':'', wantOn = c.you_want?' on':'';
      var haveLbl = c.you_have?'Have ✓':'Have', wantLbl = c.you_want?'Wanted':'Want';
      return '<div class="opp" onclick="go(\'#/site/'+c.domain+'\')">'+
        '<div class="opp-head"><div class="opp-brand"><span class="opp-favi">🎰</span><div><div class="opp-name">'+h(c.domain)+'</div><div class="opp-loc">'+p.flag+' '+h(p.country)+'</div></div></div></div>'+
        '<div class="opp-chips">'+verticals+'</div>'+
        '<div class="opp-metrics"><div class="opp-metric"><b>'+fmt(c.etv||0)+'</b><span>Monthly traffic</span></div><div class="opp-metric"><b>'+authority+'</b><span>Authority</span></div></div>'+
        '<div class="opp-btns"><button class="opp-btn have'+haveOn+'" onclick="event.stopPropagation();actSite(\''+c.domain+'\',\'have\',this)">'+haveLbl+'</button><button class="opp-btn want'+wantOn+'" onclick="event.stopPropagation();actSite(\''+c.domain+'\',\'want\',this)">'+wantLbl+'</button></div>'+
      '</div>';
    }).join('');
  }).catch(function(){document.getElementById('opp-grid').innerHTML='<div class="stat" style="padding:24px">Couldn\'t load opportunities.</div>'});
}

function actSite(domain,kind,btn){
  apiPost('/api/'+kind,{domain:domain}).then(function(j){
    if(j.ok===false){toast(j.error||'Could not save');return;}
    btn.classList.add('on');
    btn.textContent = (kind==='want'?'Wanted':'Have ✓');
    toast(kind==='want'?'Added to your Want list':'Added to your Have list');
    updateMeChip();
  }).catch(function(){toast('Network error')});
}

function renderMarketsAll(){

  else if(MKT_STATE.sort==='traffic') cs.sort(function(a,b){return (b.etv||0)-(a.etv||0)});

  var q=MKT_STATE.q, reg=MKT_STATE.region;
  var filt=cs.filter(function(c){

var MKD_PALETTE=['#3D7CFF','#8B5CF6','#EC4899','#F59E0B','#14B87A','#00D9FF'];

function setMkdView(v){
  MKD_STATE.view = v;
  try{localStorage.setItem('mkd_view', v);}catch(e){}
  var lbtn=document.getElementById('mkd-view-list');
  var gbtn=document.getElementById('mkd-view-grid');
  if(lbtn) lbtn.classList.toggle('on', v==='list');
  if(gbtn) gbtn.classList.toggle('on', v==='grid');
  var lw=document.getElementById('mkd-list-wrap');
  var gw=document.getElementById('mkd-grid-wrap');
  if(lw) lw.hidden = v!=='list';
  if(gw) gw.hidden = v!=='grid';
  renderMkdRows();
}

/* Small helper: <span class="mkd-fav"><img …><span class="mkd-mono">…</span></span>
   The img loads a real favicon via Google's public service; when it
   fails (site has no favicon or the request is blocked), the wrapper
   flips to .is-fallback and the coloured monogram tile takes over. */
function mkdFavHtml(r, color){
  var initial = ((r.name||r.domain||'?').charAt(0)||'?').toUpperCase();
  return '<span class="mkd-fav">'+
    '<img src="https://www.google.com/s2/favicons?domain='+encodeURIComponent(r.domain||'')+'&sz=64" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add(\'is-fallback\')">'+
    '<span class="mkd-mono" style="background:'+color+'">'+initial+'</span>'+
  '</span>';
}

function renderMkdRows(){
  var rows=MKD_STATE.rows.slice();
  if(MKD_STATE.cat!=='all') rows=rows.filter(function(r){return r.verts.some(function(v){return v.toLowerCase()===MKD_STATE.cat.toLowerCase();});});
  if(MKD_STATE.q) rows=rows.filter(function(r){return (r.name||'').toLowerCase().includes(MKD_STATE.q) || (r.domain||'').toLowerCase().includes(MKD_STATE.q);});
  if(MKD_STATE.sort==='traffic') rows.sort(function(a,b){return b.etv-a.etv;});
  else if(MKD_STATE.sort==='authority') rows.sort(function(a,b){return b.authority-a.authority;});
  else if(MKD_STATE.sort==='name') rows.sort(function(a,b){return a.name.localeCompare(b.name);});
  var maxEtv=rows[0]?rows[0].etv:1;
  var body=document.getElementById('mkd-body');
  var grid=document.getElementById('mkd-grid-wrap');
  if(!rows.length){
    if(body) body.innerHTML='<tr><td colspan="5" style="text-align:center;padding:48px;color:var(--ink-mute)">No sites match your filters.</td></tr>';
    if(grid) grid.innerHTML='<div style="padding:48px;text-align:center;color:var(--ink-mute);grid-column:1/-1">No sites match your filters.</div>';
    return;
  }
  if(MKD_STATE.view==='list' && body){
    body.innerHTML = rows.map(function(r,i){
      var bar=Math.max(3,Math.round(r.etv/maxEtv*100));
      var verts=(r.verts||[]).slice(0,3).map(function(v){return '<span class="chip">'+h(v.charAt(0).toUpperCase()+v.slice(1))+'</span>'}).join('');
      var color=MKD_PALETTE[i%MKD_PALETTE.length];
      return '<tr class="mk-row-link" onclick="go(\'#/site/'+r.domain+'\')">'+
        '<td><div class="mkd-site">'+mkdFavHtml(r,color)+'<div class="mkd-site-info"><b>'+h(r.name)+'</b><span>'+h(r.domain)+'</span></div></div></td>'+
        '<td><div class="mkd-tf"><b>'+fmt(r.etv)+'</b><span class="mkd-bar"><i style="width:'+bar+'%"></i></span></div></td>'+
        '<td><span class="mkd-auth">'+r.authority+'</span></td>'+
        '<td>'+verts+'</td>'+
        '<td><div class="mkd-acts" onclick="event.stopPropagation()">'+
          '<a class="mkd-visit" href="https://'+encodeURI(r.domain)+'" target="_blank" rel="noopener" title="Visit '+h(r.domain)+'"><svg viewBox="0 0 14 14" fill="none"><path d="M4 4 H10 V10 M10 4 L4 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></a>'+
          '<button class="mkd-btn have'+(r.have?' on':'')+'" onclick="actSite(\''+r.domain+'\',\'have\',this)">'+(r.have?'Have ✓':'Have')+'</button>'+
          '<button class="mkd-btn want'+(r.want?' on':'')+'" onclick="actSite(\''+r.domain+'\',\'want\',this)">'+(r.want?'Wanted':'Want')+'</button>'+
        '</div></td>'+
      '</tr>';
    }).join('');
  }
  if(MKD_STATE.view==='grid' && grid){
    grid.innerHTML = rows.map(function(r,i){
      var verts=(r.verts||[]).slice(0,3).map(function(v){return '<span class="chip">'+h(v.charAt(0).toUpperCase()+v.slice(1))+'</span>'}).join('');
      var color=MKD_PALETTE[i%MKD_PALETTE.length];
      return '<div class="mkd-card" onclick="go(\'#/site/'+r.domain+'\')">'+
        '<div class="mkd-card-head">'+mkdFavHtml(r,color)+'<div class="mkd-card-id"><b>'+h(r.name)+'</b><span>'+h(r.domain)+'</span></div></div>'+
        '<div class="mkd-card-verts">'+verts+'</div>'+
        '<div class="mkd-card-metrics">'+
          '<div class="mkd-card-metric"><b>'+fmt(r.etv)+'</b><span>Monthly traffic</span></div>'+
          '<div class="mkd-card-metric"><b>'+r.authority+'</b><span>Authority</span></div>'+
        '</div>'+
        '<div class="mkd-card-acts" onclick="event.stopPropagation()">'+
          '<button class="mkd-btn have'+(r.have?' on':'')+'" onclick="actSite(\''+r.domain+'\',\'have\',this)">'+(r.have?'Have ✓':'Have')+'</button>'+
          '<button class="mkd-btn want'+(r.want?' on':'')+'" onclick="actSite(\''+r.domain+'\',\'want\',this)">'+(r.want?'Wanted ✓':'Want')+'</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }
}

/* ==================== SITE PROFILE ==================== */
function renderSite(domain){
  document.getElementById('v-site').innerHTML='<div class="wrap" style="padding:60px 0;text-align:center;color:var(--ink-mute)">Loading '+h(domain)+'…</div>';
}
function hydrateSite(domain){
  apiGet('/api/site?domain='+encodeURIComponent(domain)).then(function(p){
    if(!p||p.error){document.getElementById('v-site').innerHTML='<div class="wrap" style="padding:60px 0"><a class="mkd-back" onclick="go(\'#/markets\')">← Back</a><div style="padding:40px;text-align:center;color:var(--ink-mute)">This site isn\'t in the network yet. <a onclick="go(\'#/markets\')" style="color:var(--blue);cursor:pointer">Browse markets</a></div></div>';return;}
    var letter=(p.name||domain).charAt(0).toUpperCase();
    var mkts=(p.regions||[]).slice().sort(function(a,b){return (b.etv||0)-(a.etv||0);});
    var maxr=(mkts[0]&&mkts[0].etv)||1;
    var mktRows=mkts.slice(0,5).map(function(g){var w=Math.max(3,Math.round((g.etv||0)/maxr*100));return '<div class="sp-mkt-row"><span class="mq-flag">'+g.flag+'</span><span style="color:var(--ink);font-weight:500;font-size:13.5px">'+h(g.name||g.iso)+'</span><span class="sp-mkt-bar"><i style="width:'+w+'%"></i></span><span class="sp-mkt-etv">'+fmt(g.etv||0)+'</span></div>';}).join('');
    var verts=(p.verticals||[]).map(function(v){return '<span class="chip">'+h(v.charAt(0).toUpperCase()+v.slice(1))+'</span>'}).join('');
    var rating = p.review_count ? Number(p.rating||0).toFixed(1)+' <span style="color:var(--ink-mute);font-size:.8em">('+p.review_count+' review'+(p.review_count===1?'':'s')+')</span>' : 'No reviews yet';
    document.getElementById('v-site').innerHTML =
      '<a class="sp-back" onclick="history.back()">← Back</a>'+
      '<div class="sp-grid">'+
        '<div>'+
          '<div class="sp-hero">'+
            '<div class="sp-shot">'+ (p.screenshot?'<img src="'+p.screenshot+'" style="max-height:200px;border-radius:8px" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="letter" style="display:none">'+letter+'</div>':'<div class="letter">'+letter+'</div>')+'</div>'+
            '<div class="sp-name">'+h(p.name||domain)+'</div>'+
            '<div class="sp-domain">'+h(domain)+' '+verts+' <a class="sp-visit" href="https://'+encodeURI(domain)+'" target="_blank" rel="noopener">Visit site →</a></div>'+
          '</div>'+
          '<div class="sp-rating"><div><div class="label">Rating</div><div class="val">'+rating+'</div></div><button class="btn btn-gho btn-sm" onclick="reviewPrompt(\''+domain+'\')"'+(p.you_reviewed?' disabled':'')+'>'+(p.you_reviewed?'Reviewed':'Add review')+'</button></div>'+
        '</div>'+
        '<div>'+
          '<div class="sp-chart-card">'+
            '<div class="sp-etv">'+fmt(p.etv||0)+'<span class="u">/mo total</span></div>'+
            '<div class="sp-chart" id="sp-chart"></div>'+
          '</div>'+
          '<div class="sp-markets-card"><h4>Traffic by market</h4>'+mktRows+ (mkts.length>5?'<div style="text-align:right;color:var(--blue);font-size:12.5px;font-weight:600;margin-top:8px">Top 5 of '+mkts.length+' markets</div>':'') +'</div>'+
          '<div class="sp-actions">'+
            '<button class="sp-btn want'+(p.you_want?' on':'')+'" onclick="actSiteBig(\''+domain+'\',\'want\',this)">'+(p.you_want?'✓ On your Want list':'I want this')+'</button>'+
            '<button class="sp-btn have'+(p.you_have?' on':'')+'" onclick="actSiteBig(\''+domain+'\',\'have\',this)">'+(p.you_have?'✓ On your Have list':'I have this')+'</button>'+
          '</div>'+
          '<div class="sp-locked">🔒 Contact hidden — swap to unlock</div>'+
        '</div>'+
      '</div>';
    drawSpChart(p.etv||0, p.traffic_history);
  }).catch(function(){document.getElementById('v-site').innerHTML='<div class="wrap" style="padding:60px 0;text-align:center;color:var(--ink-mute)">Couldn\'t load site.</div>';});
}

function actSiteBig(domain,kind,btn){
  apiPost('/api/'+kind,{domain:domain}).then(function(j){
    if(j.ok===false){toast(j.error||'Could not save');return;}
    btn.classList.add('on');
    btn.textContent = (kind==='want'?'✓ On your Want list':'✓ On your Have list');
    toast(kind==='want'?'Added to your Want list':'Added to your Have list');
    updateMeChip();
  }).catch(function(){toast('Network error')});
}

function reviewPrompt(domain){
  var body=prompt('Your review of '+domain+':');if(!body)return;
  var rating=parseInt(prompt('Rating out of 5:','4'),10);
  if(!rating||rating<1||rating>5){toast('Rating must be 1–5');return;}
  apiPost('/api/review',{domain:domain,rating:rating,body:body}).then(function(j){
    if(j.ok===false){toast(j.error||'Could not submit');return;}
    toast('Review submitted — thanks!');
    hydrateSite(domain);
  }).catch(function(){toast('Network error')});
}

function drawSpChart(E,history){
  var el=document.getElementById('sp-chart');if(!el)return;
  var N,vals=[];
  if(history&&history.length>1){N=history.length;for(var i=0;i<N;i++)vals.push(history[i].etv||0);E=Math.max.apply(null,vals)||E||1;}
  else{N=3;for(var i=0;i<N;i++){var t=i/(N-1);vals.push(E*(0.3+0.7*(1-Math.pow(1-t,1.8))));}}
  var W=560,H=120,L=48,R=12,T=12,B=26,pw=W-L-R,ph=H-T-B,YM=Math.max(E*1.15,1);
  var x=function(i){return L+i/(N-1)*pw};var y=function(v){return T+ph-v/YM*ph};
  var pts=vals.map(function(v,i){return x(i)+','+y(v)});
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:100%"><defs><linearGradient id="spg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D7CFF" stop-opacity=".22"/><stop offset="1" stop-color="#3D7CFF" stop-opacity="0"/></linearGradient></defs>'+
    [0,.5,1].map(function(f){var gy=T+ph-f*ph;return '<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="#E9F0F9" stroke-dasharray="4 4"/><text x="'+(L-8)+'" y="'+(gy+4)+'" text-anchor="end" font-size="11" fill="#9AA7BD" font-family="Geist Mono">'+fmt(f*YM)+'</text>'}).join('')+
    '<path d="M'+x(0)+','+(T+ph)+' L'+pts.join(' L')+' L'+x(N-1)+','+(T+ph)+' Z" fill="url(#spg)"/>'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="#3D7CFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+x(N-1)+'" cy="'+y(vals[N-1])+'" r="4" fill="#3D7CFF" stroke="#fff" stroke-width="2"/>'+
  '</svg>';
}

    '<span class="ll-fav">'+
      '<img src="https://www.google.com/s2/favicons?domain='+encodeURIComponent(dom)+'&sz=64" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add(\'is-fallback\')">'+

function renderAcctMk(){
  var chip=function(iso,rm){var name=(ACC_MK.filter(function(m){return m[0]===iso})[0]||[iso,iso])[1];var flagChar={us:'🇺🇸',gb:'🇬🇧',de:'🇩🇪',ca:'🇨🇦',fi:'🇫🇮',it:'🇮🇹',fr:'🇫🇷',nl:'🇳🇱',es:'🇪🇸',au:'🇦🇺',br:'🇧🇷',se:'🇸🇪',ie:'🇮🇪',nz:'🇳🇿',za:'🇿🇦',in:'🇮🇳'}[iso]||'🏳️';return '<span class="mchip"><span class="mq-flag">'+flagChar+'</span>'+h(name)+(rm?'<span class="x" onclick="removeAcctMk(\''+iso+'\')">×</span>':'')+'</span>';};
  var prof=document.getElementById('acct-mkchips'); if(prof) prof.innerHTML = ACC_SEL.map(function(i){return chip(i,true)}).join('') + '<button class="addmk" onclick="addAcctMk(this)">+ Add market</button>';
  var mir=document.getElementById('acct-mkmirror'); if(mir) mir.innerHTML = ACC_SEL.length?ACC_SEL.map(function(i){return chip(i,false)}).join(''):'<span style="color:var(--ink-mute);font-size:13px">No markets selected</span>';
}
function removeAcctMk(iso){ACC_SEL=ACC_SEL.filter(function(x){return x!==iso});renderAcctMk();}
function addAcctMk(btn){
  document.querySelectorAll('.mkmenu').forEach(function(m){m.remove();});
  var rem=ACC_MK.filter(function(m){return ACC_SEL.indexOf(m[0])<0;});
  if(!rem.length)return;
  var menu=document.createElement('div');menu.className='mkmenu';
  menu.innerHTML=rem.map(function(m){var flagChar={us:'🇺🇸',gb:'🇬🇧',de:'🇩🇪',ca:'🇨🇦',fi:'🇫🇮',it:'🇮🇹',fr:'🇫🇷',nl:'🇳🇱',es:'🇪🇸',au:'🇦🇺',br:'🇧🇷',se:'🇸🇪',ie:'🇮🇪',nz:'🇳🇿',za:'🇿🇦',in:'🇮🇳'}[m[0]]||'🏳️';return '<button onclick="ACC_SEL.push(\''+m[0]+'\');renderAcctMk();this.parentNode.remove();"><span class="mq-flag">'+flagChar+'</span>'+m[1]+'</button>';}).join('');
  btn.parentNode.appendChild(menu);
  setTimeout(function(){document.addEventListener('click',function h(){menu.remove();document.removeEventListener('click',h);},{once:true});},0);
}

function saveProfile(btn){
  var orig=btn.textContent; btn.disabled=true; btn.textContent='Saving…';
  var payload={
    real_name:document.getElementById('acct-name').value.trim(),
    company:document.getElementById('acct-company').value.trim(),
    linkedin_url:document.getElementById('acct-linkedin').value.trim(),
    site_url:(document.getElementById('acct-site')||{}).value ? document.getElementById('acct-site').value.trim() : null,

    setTimeout(function(){btn.textContent=orig;btn.disabled=false;},1600);

      '<div class="lb-tabs"><button class="lb-tab '+(LB_STATE.period==='all'?'on':'')+'" onclick="LB_STATE.period=\'all\';hydrateLeaderboard()">All time</button><button class="lb-tab '+(LB_STATE.period==='month'?'on':'')+'" onclick="LB_STATE.period=\'month\';hydrateLeaderboard()">This month</button></div>'+
      (entries.length?'<div class="podium">'+podium+'</div>'+(rows?'<h2 class="section-h" style="margin:24px 0 12px;font-size:20px">Rankings</h2>'+rows:'') : '<div class="sw-empty">No swaps or reviews yet — be the first to climb the leaderboard.</div>')+
      '<div class="loy-card" style="margin-top:24px"><div style="font-weight:700;margin-bottom:6px">Your position</div><div style="color:var(--ink-mute);font-size:14px">'+yourRank+'</div></div>';
  }).catch(function(){document.getElementById('v-leaderboard').innerHTML='<div style="padding:24px;color:var(--ink-mute)">Couldn\'t load leaderboard.</div>';});
}

/* ==================== STUB VIEWS (alerts, chat) ==================== */
function renderStub(name){
  document.getElementById('v-stub').innerHTML='<div class="stub"><h2>'+h(name)+'</h2><p>This section is on the way — the nav and routing all work; content lands next.</p><button class="btn" style="margin-top:20px" onclick="go(\'#/markets\')">Browse markets</button></div>';
}

/* ==================== ROUTER ==================== */
function switchTo(id){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on')});document.getElementById(id).classList.add('on');window.scrollTo(0,0)}
function route(){
  var hash=location.hash||'#/home';
  var parts=hash.slice(2).split('/');
  var s=parts[0]||'home';
  updateNav(s);
  if(s==='home'){renderHome();hydrateHome();switchTo('v-home')}
  else if(s==='markets'){renderMarkets();hydrateMarkets();switchTo('v-markets')}
  else if(s==='market'){var iso=(parts[1]||'US').toUpperCase();renderMarket(iso);hydrateMarket(iso);switchTo('v-market')}
  else if(s==='site'){var dm=decodeURIComponent(parts.slice(1).join('/'));renderSite(dm);hydrateSite(dm);switchTo('v-site')}
  else if(s==='swaps'){window.ACCT_TAB='swaps';window._ACCT_TAB_REDIRECT=true;go('#/account');return;}
  else if(s==='matches'){window.ACCT_TAB='matches';window._ACCT_TAB_REDIRECT=true;go('#/account');return;}
  else if(s==='loyalty'){window.ACCT_TAB='loyalty';window._ACCT_TAB_REDIRECT=true;go('#/account');return;}
  else if(s==='alerts'){window.ACCT_TAB='profile';window._ACCT_TAB_REDIRECT=true;go('#/account');return;}
  else if(s==='lists'||s==='wants'||s==='haves'){window.ACCT_TAB='lists';window._ACCT_TAB_REDIRECT=true;go('#/account');return;}
  else if(s==='account'){if(!window._ACCT_TAB_REDIRECT) window.ACCT_TAB='profile';window._ACCT_TAB_REDIRECT=false;renderAccount();hydrateAccount();switchTo('v-account')}
  else if(s==='signup'){renderSignup();switchTo('v-signup')}
  else if(s==='login'){renderLogin();switchTo('v-login')}
  else if(s==='privacy'){renderPrivacy();switchTo('v-privacy')}
  else if(s==='terms'){renderTerms();switchTo('v-terms')}
  else if(s==='leaderboard'){renderLeaderboard();hydrateLeaderboard();switchTo('v-leaderboard')}
  else if(s==='payments'||s==='billing'||s==='plans'){renderPayments();hydratePayments();switchTo('v-payments')}
  else if(s==='chat'){renderStub('Chat');switchTo('v-stub')}
  else{renderHome();hydrateHome();switchTo('v-home')}
}
window.addEventListener('hashchange',route);
updateMeChip();
route();
</script>
</body>
</html>
