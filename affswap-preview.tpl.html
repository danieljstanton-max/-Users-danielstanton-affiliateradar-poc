<style>
  .pv-wrap{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Manrope,sans-serif;background:linear-gradient(180deg,#EAF1FB,#F2F7FE);padding:26px 20px 40px;min-height:100vh;box-sizing:border-box}
  .pv-head{text-align:center;margin-bottom:22px}
  .pv-head h1{margin:0 0 5px;font-size:1.35rem;font-weight:800;color:#12213F;letter-spacing:-.02em}
  .pv-head p{margin:0;color:#5C6B85;font-size:.9rem}
  .pv-row{display:flex;gap:30px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
  .pv-col{display:flex;flex-direction:column;align-items:center;gap:11px}
  .pv-label{font-size:.76rem;font-weight:700;color:#5C6B85;text-transform:uppercase;letter-spacing:.08em}
  .desk{width:742px;max-width:100%;border-radius:13px;overflow:hidden;box-shadow:0 24px 55px rgba(31,74,140,.18);background:#fff;border:1px solid #dbe3ef}
  .desk .bar{height:36px;background:#f1f4fa;border-bottom:1px solid #e4ebf4;display:flex;align-items:center;gap:7px;padding:0 13px}
  .desk .bar i{width:11px;height:11px;border-radius:50%;background:#d6dce7;display:block}
  .desk .bar .url{margin-left:12px;font-size:.72rem;color:#8492ac;background:#fff;border:1px solid #e4ebf4;border-radius:6px;padding:4px 12px}
  .desk .screen{width:742px;max-width:100%;height:495px;overflow:hidden;position:relative;background:#F5F9FE}
  .desk .screen iframe{width:1280px;height:854px;border:0;transform:scale(.5797);transform-origin:top left}
  .phone{width:390px;max-width:100%;border-radius:46px;background:#101f3e;padding:13px;box-shadow:0 24px 55px rgba(31,74,140,.22)}
  .phone .screen{width:364px;height:740px;border-radius:33px;overflow:hidden;background:#fff;position:relative}
  .phone .screen iframe{width:390px;height:793px;border:0;transform:scale(.9333);transform-origin:top left}
  .phone .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:118px;height:23px;background:#101f3e;border-radius:0 0 15px 15px;z-index:2}
  .pv-hint{margin-top:6px;font-size:.72rem;color:#8492ac}
</style>
<div class="pv-wrap">
  <div class="pv-head"><h1>Affswap &mdash; Homepage</h1><p>Desktop and mobile, side by side &middot; scroll inside each screen to explore</p></div>
  <div class="pv-row">
    <div class="pv-col">
      <span class="pv-label">Desktop &middot; 1280px</span>
      <div class="desk">
        <div class="bar"><i></i><i></i><i></i><span class="url">affswap.com</span></div>
        <div class="screen"><iframe srcdoc="__DOC__" title="Affswap desktop preview" loading="lazy"></iframe></div>
      </div>
      <span class="pv-hint">Scroll within the window</span>
    </div>
    <div class="pv-col">
      <span class="pv-label">Mobile &middot; 390px</span>
      <div class="phone"><div class="screen"><div class="notch"></div><iframe srcdoc="__DOC__" title="Affswap mobile preview" loading="lazy"></iframe></div></div>
      <span class="pv-hint">Scroll within the phone</span>
    </div>
  </div>
</div>
