<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affswap — responsive preview</title>
<style>
  :root{--s:1;--bg:#04050c;--ink:#eaf4ff;--ink2:#94afde;--ink3:#5a6e97;--cyan:#38c6ff;--line:rgba(80,196,255,.28);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);color:var(--ink);display:flex;flex-direction:column;
    background:radial-gradient(1200px 800px at 15% -10%,rgba(56,198,255,.14),transparent 56%),
      radial-gradient(1000px 700px at 100% 0,rgba(90,120,255,.10),transparent 55%),linear-gradient(180deg,#06080f,#04050c)}
  .bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#05070ee6,#05070ecc);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
  .brand{font:700 15px var(--sans);letter-spacing:-.2px}
  .brand span{color:var(--cyan);text-shadow:0 0 20px rgba(56,198,255,.6)}
  .eyebrow{font:600 10.5px var(--mono);letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}
  .seg{display:inline-flex;background:rgba(16,26,52,.7);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg button{cursor:pointer;border:0;background:transparent;color:var(--ink2);font:600 13.5px var(--sans);
    padding:8px 16px;border-radius:9px;display:flex;align-items:center;gap:8px}
  .seg button.on{background:rgba(56,198,255,.15);color:#7fe4ff;box-shadow:inset 0 0 0 1px var(--cyan),0 0 18px rgba(56,198,255,.4)}
  .dims{margin-left:auto;color:var(--ink3);font:600 12px var(--mono)}
  .hint{color:var(--ink3);font-size:12px;width:100%;margin-top:-4px}
  .stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:26px 16px 50px;overflow:auto}

  /* ---- mobile: phone bezel ---- */
  .device.mobile .win{width:392px;height:812px;border-radius:46px;padding:13px;
    background:linear-gradient(160deg,#16243f,#05070e);
    box-shadow:0 40px 90px -24px rgba(56,198,255,.4),0 0 0 1px rgba(90,200,255,.32),0 0 44px -6px rgba(56,198,255,.3)}
  .device.mobile .chrome{display:none}
  .device.mobile iframe{width:100%;height:100%;border:0;border-radius:33px;background:#05070f}
  .device.mobile .notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:128px;height:26px;
    background:#05070e;border-radius:0 0 16px 16px;z-index:2}

  /* ---- desktop: browser window, zoomed to fit ---- */
  .device.desktop .win{width:1300px;zoom:var(--s);border-radius:14px;overflow:hidden;border:1px solid var(--line);
    background:#080d1f;box-shadow:0 40px 90px -24px rgba(56,198,255,.35),0 0 0 1px rgba(90,200,255,.3)}
  .device.desktop .chrome{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;
    background:linear-gradient(180deg,#0c1424,#0a1120);border-bottom:1px solid var(--line)}
  .device.desktop .dot{width:11px;height:11px;border-radius:50%}
  .device.desktop .url{flex:1;margin-left:10px;height:24px;border-radius:7px;background:#05070f;border:1px solid var(--line);
    color:var(--ink3);font:600 12px var(--mono);display:flex;align-items:center;padding:0 12px}
  .device.desktop iframe{width:1300px;height:812px;border:0;background:#05070f;display:block}

  .device{position:relative}
  .device.mobile{position:relative}
</style>
</head>
<body>
  <div class="bar">
    <div>
      <div class="eyebrow">Affswap · responsive preview</div>
      <div class="brand">Aff<span>swap</span> — how it looks on each device</div>
    </div>
    <div class="seg" id="seg">
      <button data-m="mobile">📱 Mobile</button>
      <button data-m="desktop" class="on">🖥 Desktop</button>
    </div>
    <div class="dims" id="dims"></div>
    <div class="hint">Live geo explorer, running at a real phone-width vs desktop-width viewport — the grid actually
      reflows between the two. Click a site inside to open its profile + screenshot.</div>
  </div>
  <div class="stage">
    <div class="device desktop" id="device">
      <div class="notch"></div>
      <div class="win">
        <div class="chrome">
          <span class="dot" style="background:#ff5f57"></span>
          <span class="dot" style="background:#febc2e"></span>
          <span class="dot" style="background:#28c840"></span>
          <span class="url">affswap.app — geo explorer</span>
        </div>
        <iframe id="frame" src="explore-live.html" title="Affswap"></iframe>
      </div>
    </div>
  </div>

<script>
  var device=document.getElementById('device'), seg=document.getElementById('seg'),
      dims=document.getElementById('dims'), frame=document.getElementById('frame');
  var mode='desktop';
  function fit(){
    if(mode==='desktop'){
      var stageW=document.querySelector('.stage').clientWidth;
      var s=Math.min(1,(stageW-32)/1300);
      document.documentElement.style.setProperty('--s',s);
      dims.textContent='1280 × 800  ·  '+Math.round(s*100)+'%';
    }else{
      dims.textContent='390 × 812  ·  100%';
    }
  }
  function set(m){
    mode=m; device.className='device '+m;
    // resize the mobile iframe viewport correctly
    if(m==='mobile'){frame.style.height='';}
    [].forEach.call(seg.children,function(b){b.classList.toggle('on',b.dataset.m===m);});
    fit();
  }
  seg.addEventListener('click',function(e){var b=e.target.closest('button');if(b)set(b.dataset.m);});
  window.addEventListener('resize',fit);
  set('desktop');
</script>
</body>
</html>
